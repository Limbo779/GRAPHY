[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphy"
version = "0.1.0"
description = "Problem-solving and self-discovery learning system for Math, Physics, and CS textbooks, with GRAPHY Companion."
readme = "ideastorm.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GRAPHY Team" }]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "PyYAML>=6.0.1",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "rustworkx>=0.15.0",
    "pyarrow>=16.0.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
ai = [
    "onnxruntime>=1.18.0",
    "lancedb>=0.13.0",
    "huggingface-hub>=0.23.0",
    "tokenizers>=0.19.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
graphy = "graphy.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
